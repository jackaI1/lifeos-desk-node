name: CAN monitor
on:
  push:
    branches: [main, skills/auto-can-bus-can-fd]
    paths: ['can_monitor/**', '.github/workflows/can-monitor.yml']
  pull_request:
    paths: ['can_monitor/**', '.github/workflows/can-monitor.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r can_monitor/requirements.txt
      - name: Create owned Linux virtual CAN interface
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y linux-modules-extra-$(uname -r) can-utils
          sudo modprobe vcan
          sudo ip link add dev deskcan0 type vcan
          sudo ip link set dev deskcan0 mtu 72 up
      - name: Unit, fault, virtual bus and real SocketCAN tests
        env:
          DESK_VCAN: deskcan0
        run: python -m pytest can_monitor/tests -q
      - name: Replay fault recording over Linux CAN FD
        run: |
          python -m can_monitor.replay --generate /tmp/can-faults.jsonl --faults
          python -m can_monitor.replay /tmp/can-faults.jsonl --interface socketcan --channel deskcan0 --tail 3 > /tmp/can-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: can-report-${{ matrix.python }}
          path: /tmp/can-report.json
      - name: Remove owned interface
        if: always()
        run: sudo ip link delete deskcan0 || true
