name: Desk network monitoring and telemetry
on:
  push:
    branches: [main]
    paths: ['networking/**', 'firmware/tools/**', '.github/workflows/networking.yml']
  pull_request:
    paths: ['networking/**', 'firmware/tools/**', '.github/workflows/networking.yml']
permissions:
  contents: read
jobs:
  protocols:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r networking/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y snmp snmpd nftables mosquitto
      - run: networking/deploy/certificates.sh
      - name: Start owned TLS broker container
        run: docker compose -f networking/compose.yml up -d broker
      - name: TCP fault, SNMP wire, TLS, storage and broker-reconnect tests
        env: {DESK_SNMP: '1', DESK_BROKER: '1'}
        run: python -m pytest networking/tests -q
      - name: Isolated firewall test with an allowed and a listening blocked port
        run: sudo bash networking/deploy/firewall-test.sh
      - name: Build and run the gateway container
        run: |
          mkdir -p networking/build/data
          chmod 777 networking/build/data
          docker compose -f networking/compose.yml up -d --build gateway
          for i in $(seq 1 30); do
            curl -fsS 'http://localhost:8093/v1/readings/000000000001?limit=1' && break
            sleep 1
          done
          docker compose -f networking/compose.yml --profile send run --rm sensor
          sleep 2
          curl -fsS 'http://localhost:8093/v1/readings/000000000001?limit=1' | python -c 'import json,sys; assert json.load(sys.stdin)[0]["temperature_mc"] == 21500'
      - name: Release owned containers and volumes
        if: always()
        run: docker compose -f networking/compose.yml down -v --remove-orphans
