name: bms-hil-test-bench / BMS bench CI
on:
  push:
    branches:
    - main
    paths:
    - projects/bms-hil-test-bench/**
    - .github/workflows/bms-hil-test-bench-ci.yml
  pull_request:
    paths:
    - projects/bms-hil-test-bench/**
    - .github/workflows/bms-hil-test-bench-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Install package and development tools
      run: python -m pip install '.[dev]'
    - name: Check formatting and lint
      run: 'ruff check .

        ruff format --check .

        '
    - name: Run all tests
      run: python -m pytest -q --junitxml=reports/pytest.xml
    - name: Build and install wheel
      run: 'python -m build

        python -m pip install --force-reinstall --no-deps dist/*.whl

        '
    - name: Run installed wheel outside source tree
      if: ${{ !cancelled() }}
      working-directory: projects/bms-hil-test-bench/${{ runner.temp }}
      run: python -m bms_hil --output "${{ github.workspace }}/reports"
    - name: Run high-voltage acceptance checks
      working-directory: projects/bms-hil-test-bench/${{ runner.temp }}
      run: python -m bms_hil.high_voltage
    - name: Upload verdicts and traces
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bms-results-python-${{ matrix.python }}
        path: projects/bms-hil-test-bench/reports/
        if-no-files-found: error
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/bms-hil-test-bench
