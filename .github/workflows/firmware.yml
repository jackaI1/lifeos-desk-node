name: Firmware
on:
  push:
    branches: [main, 'skills/firmware']
  pull_request:
    paths: ['firmware/**', 'docs/pinout.md', '.github/workflows/firmware.yml', 'README.md']
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pure C sanitizer and API adapter tests
        run: firmware/tests/run_host_tests.sh
  esp-idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 firmware and report size
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.defaults" set-target esp32
          idf.py build
          idf.py size
      - name: Upload flashable firmware (no credentials)
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-desk-node-esp32
          path: |
            firmware/build/lifeos_desk_node.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
            firmware/build/project_description.json
          retention-days: 14
