name: Firmware
on:
  push:
    paths-ignore: ['projects/**']
    branches: [main, 'skills/firmware']
  pull_request:
    paths: ['firmware/**', 'docs/pinout.md', '.github/workflows/firmware.yml', 'README.md']
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pure C sanitizer and API adapter tests
        run: firmware/tests/run_host_tests.sh
  esp-idf-build:
    strategy:
      fail-fast: false
      matrix:
        display: [spi, i2c]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 firmware and report size
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.defaults;sdkconfig.${{ matrix.display }}.defaults" set-target esp32
          if [ "${{ matrix.display }}" = "spi" ]; then
            grep -q '^CONFIG_DESK_DISPLAY_SPI=y$' sdkconfig
          else
            grep -q '^CONFIG_DESK_DISPLAY_I2C=y$' sdkconfig
          fi
          idf.py build
          idf.py size
      - name: Build with the CAN link enabled
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-can -D SDKCONFIG=sdkconfig.can -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.defaults;sdkconfig.spi.defaults;sdkconfig.can.defaults" set-target esp32
          grep -q '^CONFIG_DESK_CAN_ENABLE=y$' sdkconfig.can
          idf.py -B build-can build
      - name: Build with Bluetooth Low Energy enabled (NimBLE)
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-ble -D SDKCONFIG=sdkconfig.ble -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.defaults;sdkconfig.spi.defaults;sdkconfig.ble.defaults" set-target esp32
          grep -q '^CONFIG_DESK_BLE_ENABLE=y$' sdkconfig.ble
          grep -q '^CONFIG_BT_NIMBLE_ENABLED=y$' sdkconfig.ble
          idf.py -B build-ble build
      - name: Upload flashable firmware (no credentials)
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-desk-node-esp32-${{ matrix.display }}
          path: |
            firmware/build/lifeos_desk_node.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
            firmware/build/project_description.json
          retention-days: 14
