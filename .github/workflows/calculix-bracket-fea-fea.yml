name: calculix-bracket-fea / Structural checks
on:
  push:
    branches:
    - main
    paths:
    - projects/calculix-bracket-fea/**
    - .github/workflows/calculix-bracket-fea-fea.yml
  pull_request:
    paths:
    - projects/calculix-bracket-fea/**
    - .github/workflows/calculix-bracket-fea-fea.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install native solver and headless mesher libraries
      run: 'sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends calculix-ccx libglu1-mesa libxrender1 libxcursor1 libxinerama1 libfltk1.3t64

        python -m pip install -r requirements.txt

        '
    - name: Run unit, mesh and real beam solver tests
      run: python -m pytest -q
    - name: Solve and check all twelve bracket models
      run: python -m fea.study all --output build/report
    - name: Keep computed report and input decks for review
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fea-study
        path: projects/calculix-bracket-fea/build/
        retention-days: 7
defaults:
  run:
    working-directory: projects/calculix-bracket-fea
