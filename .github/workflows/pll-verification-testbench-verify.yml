name: pll-verification-testbench / Verify digital PLL
on:
  push:
    branches:
    - main
    paths:
    - projects/pll-verification-testbench/**
    - .github/workflows/pll-verification-testbench-verify.yml
  pull_request:
    paths:
    - projects/pll-verification-testbench/**
    - .github/workflows/pll-verification-testbench-verify.yml
  workflow_dispatch: {}
jobs:
  regression:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: brew install verilator yosys
    - run: python -m pip install -r requirements.txt
    - run: python -m pytest -q
    - run: yosys -c scripts/synth.tcl
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/pll-verification-testbench
