name: solidworks-enclosure-tools / Export checks
on:
  push:
    branches:
    - main
    paths:
    - projects/solidworks-enclosure-tools/**
    - .github/workflows/solidworks-enclosure-tools-mesh.yml
  pull_request:
    paths:
    - projects/solidworks-enclosure-tools/**
    - .github/workflows/solidworks-enclosure-tools-mesh.yml
  workflow_dispatch: {}
jobs:
  mesh:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python tools/check.py
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/solidworks-enclosure-tools
