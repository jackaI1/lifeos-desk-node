name: submeter-accuracy-bench / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/submeter-accuracy-bench/**
    - .github/workflows/submeter-accuracy-bench-ci.yml
  pull_request:
    paths:
    - projects/submeter-accuracy-bench/**
    - .github/workflows/submeter-accuracy-bench-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.12.19
        enable-cache: true
        working-directory: projects/submeter-accuracy-bench
    - run: uv sync --frozen
    - run: uv run --frozen ruff check .
    - run: uv run --frozen ruff format --check .
    - run: uv run --frozen pytest -q
    - run: uv build
    - name: Run the drifting example
      run: uv run --frozen submeter-bench --output reports/demo
    - name: Check an undrifted batch with strict failure status
      run: uv run --frozen submeter-bench --gain-drift-pct 0 --output reports/stable --fail-on-unit-failure
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: matrix.python-version == '3.12'
      with:
        name: simulated-meter-reports
        path: projects/submeter-accuracy-bench/reports/
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/submeter-accuracy-bench
