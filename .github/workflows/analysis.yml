name: Sensor analysis
on:
  push:
    branches: [main]
    paths: ['analysis/**', 'docs/signal-analysis*', '.github/workflows/analysis.yml', 'README.md']
  pull_request:
    paths: ['analysis/**', 'docs/signal-analysis*', '.github/workflows/analysis.yml', 'README.md']
permissions:
  contents: read
jobs:
  filters-and-fft:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: analysis/requirements*.txt
      - run: python -m pip install -r analysis/requirements-dev.txt
      - name: Known-tone, cutoff, log import and CLI tests
        run: python -m pytest analysis/tests -q
      - name: Reproduce synthetic ground-truth comparison
        run: |
          python -m analysis.demo
          diff -u docs/signal-analysis-report.md analysis/build/demo/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: signal-analysis-python-${{ matrix.python }}
          path: analysis/build/demo/
          retention-days: 14
