name: optical-link-test-automation / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/optical-link-test-automation/**
    - .github/workflows/optical-link-test-automation-ci.yml
  pull_request:
    paths:
    - projects/optical-link-test-automation/**
    - .github/workflows/optical-link-test-automation-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - run: python -m pytest -q
    - run: python -m optical_station --output /tmp/report.html
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/optical-link-test-automation
