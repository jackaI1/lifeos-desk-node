name: semiconductor-process-doe / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/semiconductor-process-doe/**
    - .github/workflows/semiconductor-process-doe-tests.yml
  pull_request:
    paths:
    - projects/semiconductor-process-doe/**
    - .github/workflows/semiconductor-process-doe-tests.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install '.[test]'
    - run: python -m pytest -q
    - run: python -m semiconductor_doe --output /tmp/process-results
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/semiconductor-process-doe
