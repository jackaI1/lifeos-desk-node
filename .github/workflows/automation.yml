name: Building automation
on:
  push:
    branches: [main]
    paths: ['automation/**', 'firmware/tools/desk_api.py', 'docs/building-automation.md', '.github/workflows/automation.yml', 'README.md']
  pull_request:
    paths: ['automation/**', 'firmware/tools/desk_api.py', 'docs/building-automation.md', '.github/workflows/automation.yml', 'README.md']
permissions:
  contents: read
jobs:
  protocols-and-control:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - run: python -m pip install -r automation/requirements.txt
      - name: Thermostat, adapter bridge, real TCP/UDP and shutdown tests
        run: python -m unittest discover -s automation/tests -v
