name: Anomaly detector (int8) checks
on:
  push:
    branches: [main]
    paths: ['anomaly_int8/**', '.github/workflows/anomaly-int8.yml']
  pull_request:
    paths: ['anomaly_int8/**', '.github/workflows/anomaly-int8.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Use the CPU build of torch so pip does not download the CUDA libraries.
      - name: Install torch (CPU) and the pinned packages
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          python -m pip install -r anomaly_int8/requirements.txt
      - name: Train, quantize, run the C routine against the Python reference, and check the report
        working-directory: anomaly_int8
        run: python -m pytest -v
