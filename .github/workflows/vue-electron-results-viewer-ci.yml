name: vue-electron-results-viewer / Desktop checks
on:
  push:
    branches:
    - main
    paths:
    - projects/vue-electron-results-viewer/**
    - .github/workflows/vue-electron-results-viewer-ci.yml
  pull_request:
    paths:
    - projects/vue-electron-results-viewer/**
    - .github/workflows/vue-electron-results-viewer-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Test and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: projects/vue-electron-results-viewer/package-lock.json
    - run: npm ci
    - run: npm test
    - run: npm run build
    - name: Install Electron system libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2
        libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 xvfb
    - name: Desktop end-to-end tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a npm run test:e2e
    - name: Desktop end-to-end tests (Windows)
      if: runner.os == 'Windows'
      run: npm run test:e2e
    - name: Package desktop installer
      run: npm run package
    - name: Test packaged desktop (Linux)
      if: runner.os == 'Linux'
      env:
        ELECTRON_APP_PATH: ${{ github.workspace }}/release/linux-unpacked/results-viewer
      run: xvfb-run -a npm run test:e2e
    - name: Test packaged desktop (Windows)
      if: runner.os == 'Windows'
      env:
        ELECTRON_APP_PATH: ${{ github.workspace }}\release\win-unpacked\Results Viewer.exe
      run: npm run test:e2e
    - uses: actions/upload-artifact@v4
      with:
        name: desktop-${{ runner.os }}
        path: 'projects/vue-electron-results-viewer/release/*.AppImage

          projects/vue-electron-results-viewer/release/*.tar.gz

          projects/vue-electron-results-viewer/release/*.exe'
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-evidence-${{ runner.os }}
        path: projects/vue-electron-results-viewer/test-results/
defaults:
  run:
    working-directory: projects/vue-electron-results-viewer
