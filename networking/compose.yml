services:
  broker:
    image: eclipse-mosquitto:2.0.22
    ports: ["127.0.0.1:8883:8883"]
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./build/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./build/certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./build/certs/server.key:/mosquitto/certs/server.key:ro
  gateway:
    build:
      context: ..
      dockerfile: networking/deploy/Dockerfile
    command: [gateway, --ca, /certs/ca.crt, --host, broker, --database, /data/room.sqlite3]
    volumes:
      - ./build/certs/ca.crt:/certs/ca.crt:ro
      - ./build/data:/data
    ports: ["127.0.0.1:8093:8093"]
    depends_on: [broker]
  sensor:
    build:
      context: ..
      dockerfile: networking/deploy/Dockerfile
    profiles: [send]
    command: [publish, --ca, /certs/ca.crt, --host, broker]
    volumes: ["./build/certs/ca.crt:/certs/ca.crt:ro"]
    depends_on: [broker]
