[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-hil-test-bench"
version = "0.1.0"
description = "Deterministic battery protection controller and software HIL-style fault bench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jack Lai"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
bms-hil = "bms_hil.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
