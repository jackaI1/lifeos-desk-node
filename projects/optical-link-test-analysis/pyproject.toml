[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optical-link-test-analysis"
version = "0.1.0"
description = "Reproducible simulated optical BERT, eye and spectrum measurements"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[project.optional-dependencies]
visa = ["pyvisa>=1.14"]

[project.scripts]
optical-link = "optical_link.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/optical_link"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
