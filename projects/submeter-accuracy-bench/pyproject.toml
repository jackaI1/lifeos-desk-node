[project]
name = "submeter-accuracy-bench"
version = "0.1.0"
description = "Reproducible simulated electricity meter accuracy and batch monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "matplotlib>=3.9,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
submeter-bench = "submeter_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/submeter_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
