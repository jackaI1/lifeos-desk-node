#cloud-config
package_update: true
packages: [python3, python3-venv, git]
runcmd:
  - [git, clone, --depth, '1', 'https://github.com/jackaI1/lifeos-desk-node.git', /opt/desk-lab]
  - [python3, -m, venv, /opt/desk-lab/.venv]
  - [/opt/desk-lab/.venv/bin/pip, install, -r, /opt/desk-lab/network_lab/requirements.txt]
# Certificate/key paths must be supplied by the owner before enabling the service.
# No private key or invented public endpoint is part of this template.
